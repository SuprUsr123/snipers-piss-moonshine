## Hostname or IP-address of host to connect to
## By default host is autodiscovered using mDNS
#address = 1.2.3.4

## Video streaming configuration
#width = 1280
#height = 720
#fps = 60

## Output rotation (independent of xrandr or framebuffer settings!)
## Allowed values: 0, 90, 180, 270
#rotate = 0

## Bitrate depends by default on resolution and fps
## Set to -1 to enable default
## 20Mbps (20000) for 1080p (60 fps)
## 10Mbps (10000) for 1080p or 60 fps
## 5Mbps (5000) for lower resolution or fps
#bitrate = -1

## Size of network packets should be lower than MTU
## If streaming with WAN optimizations, this will be capped at 1024.
#packetsize = 1392

## Select video codec (auto/h264/h265)
#codec = auto

## Default started application on host
#app = Steam

## Default used mapping for streaming
## Searched for in $XDG_DATA_DIRS/moonlight or /usr/share/moonlight and /usr/local/share/moonlight
## Mapping can also be user overrided in $XDG_CONFIG_DIR/moonlight or ~/.config/moonlight or current directory
#mapping = gamecontrollerdb.txt

## Enable selected input devices
## By default all available input devices should be used
## Only evdev devices /dev/input/event* are allowed
## To use a different mapping then default another mapping should be declared above the input
#input = /dev/input/event1

## Enable GFE for changing graphical game settings for optimal performance and quality
#sops = true

## Play audio on host instead of streaming to client
#localaudio = false

## Send quit app request to remote after quitting session
#quitappafter = false

## Disable all input processing (view-only mode)
#viewonly = false

## Select audio device to play sound on
#audio = sysdefault

## Select the audio and video decoder to use
## default - autodetect
## aml - hardware video decoder for ODROID-C1/C2
## rk  - hardware video decoder for ODROID-N1 Rockchip
## omx - hardware video decoder for Raspberry Pi
## imx - hardware video decoder for i.MX6 devices
## x11 - software decoder
## sdl - software decoder with SDL input and audio
## fake - no audio and video
#platform = default

## Directory to store encryption keys
## By default keys are stored in $XDG_CACHE_DIR/moonlight or ~/.cache/moonlight
#keydir = /dir/to/keys

## Enable QOS settings to optimize for internet or local network
## yes - optimize for WAN streaming
## no - optimize for LAN streaming
## auto (default) - decide automatically based on target IP address
#remote = auto

## Enable 5.1/7.1 surround sound
#surround = 5.1

## Load additional configuration files
#config = /path/to/config

## Kindle e-ink panel update policy
## NOTE: everything below can be set on the device itself - the Settings
## button in the bottom bar of the touch UI. On-device choices are saved
## to <keydir>/settings (moonlight.conf syntax) and WIN over this file;
## delete a line there to fall back to moonlight.conf.
## refresh     - minimum milliseconds between panel updates (small regions use
##               the fastest e-ink waveforms; default 100 = up to 10 updates/s)
## fullrefresh - minimum milliseconds between full-panel repaints that clear
##               accumulated ghosting (default 2000; 0 disables). Full repaints
##               only happen while content is changing, never on a static screen.
## wfm         - e-ink waveform for panel updates when FBink is compiled in
##               (build with FBINK_SRC set): auto picks A2 for tiny regions
##               (cursor, caret), DU for medium ones and GC16 for the rest,
##               while the periodic full repaint flashes with GC16; a2, du
##               or gc16 force one mode; off leaves the panel to the X
##               server (default auto)
## fbinkrotate - rotation between the X screen and the framebuffer used for
##               FBink region updates. Auto-detected from the screen sizes;
##               set 90, 180 or 270 if partial updates land in the wrong
##               place while the device is rotated (-1 = auto)
## rendermode  - rendering preset: fast, balanced or quality. A preset sets
##               refresh, fullrefresh and wfm together and is what the Mode
##               button in the streaming options bar starts from:
##                 fast     = 30 ms, flash every 15 s, A2 (typing/mouse)
##                 balanced = 66 ms, flash every 10 s, auto waveform
##                 quality  = 120 ms, flash every 30 s, GC16 (documents)
##               Default on Kindle: fast (the secondary-screen preset).
##               The Stream page in the UI selects the same presets.
## backend     - where the decoded pixels go:
##                 x11   = through the X server, which also picks the e-ink
##                         waveforms (reference behavior, most compatible)
##                 fbink = straight into the framebuffer via mmap'ed /dev/fb0,
##                         every region refreshed through FBink with an
##                         explicit waveform; skips the X server entirely for
##                         the video, the lowest-latency path (needs FBink
##                         compiled in)
##               Default: fbink when the binary was built with FBink,
##               x11 otherwise. The Render button in the streaming options
##               bar switches between the two while the stream runs.
## rotate      - software rotation of the video itself: 0, 90, 180 or 270.
##               This is what puts a landscape desktop on the portrait
##               panel while the Kindle is held sideways; the Rotate
##               button in the stream options bar does the same live.
##               The firmware's own orientation switch (lipc
##               orientationLock) only affects the stock book reader, not
##               this app. Default: auto - the renderer picks 0 or 90,
##               whichever uses the panel better, and remembers it.
## performance - launch.sh normally switches the CPU governor to
##               performance while the client runs (software decode is
##               the bottleneck) and restores it on exit. Set false to
##               keep the stock governor.
## uizoom      - menu zoom factor: 0.4 .. 3.0. Below 1 zooms the menu out
##               (smaller text, more of a page fits), above 1 zooms in.
##               The Settings page > Interface group sets the same thing
##               (Tiny/Small/Normal/Large/Huge) and applies it at once;
##               the auto-fit still shrinks a size that would overflow.
#refresh = 100
#fullrefresh = 2000
#wfm = auto
#fbinkrotate = -1
#rendermode = fast
#backend = fbink
#rotate = -1
#performance = true
#uizoom = 1.0
